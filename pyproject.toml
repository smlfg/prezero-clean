[project]
name = "prezero-clean"
version = "0.1.0"
description = "Sauberer Neustart: PreZero Glascontainer, nur mit den gegebenen Daten"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100