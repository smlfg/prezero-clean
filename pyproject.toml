[project]
name = "prezero-clean"
version = "0.1.0"
description = "Sauberer Neustart: Analyse der Glascontainer-Fuellstandsdaten (PreZero-Challenge)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100